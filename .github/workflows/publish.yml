name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Verify codegen output is up to date
        run: |
          npm run codegen
          if [[ -n "$(git status --porcelain -- src/)" ]]; then
            echo "::error::Committed src/ is out of date. Run 'npm run codegen' and commit the result."
            git status --short -- src/
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Verify build output is complete
        run: |
          if [[ ! -f build/package.json ]]; then
            echo "::error::build/package.json not found — prepare-publishing may have failed."
            exit 1
          fi

      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./build/package.json').version")"
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish ./build --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
