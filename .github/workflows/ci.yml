name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubicloud-standard-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.16.0"

      - name: Install dependencies
        run: npm ci

      - name: Pin submodule versions
        run: npm run set-versions

      - name: Generate code (.proto -> .ts)
        run: npm run codegen

      - name: Verify codegen output is up to date
        run: |
          if [[ -n "$(git status --porcelain -- src/)" ]]; then
            echo "::error::Committed src/ is out of date. Run 'npm run codegen' and commit the result."
            git status --short -- src/
            git --no-pager diff -- src/
            exit 1
          fi

      - name: Build (.ts -> .js/.d.ts)
        run: npm run build

      - name: Verify build output is complete
        run: |
          if [[ ! -f build/package.json ]]; then
            echo "::error::build/package.json not found — prepare-publishing may have failed."
            exit 1
          fi
