name: Verify build artifacts

on:
  pull_request:
    branches:
      - main

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild package artifacts
        run: npm run build

      - name: Verify committed build directory is up to date
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- build)" ]]; then
            echo "Committed ./build is out of date. Please run 'npm run build' and commit updated build artifacts."
            git status --short -- build
            exit 1
          fi
